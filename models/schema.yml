version: 2

sources:
  - name: raw
    schema: gwz_raw_data
    description: "Greenweez projesinin ham (raw) verilerini içeren BigQuery veri kümesi (dataset)."
    
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Müşterilerin günlük ve ürün bazlı ham satış verilerini içeren tablo."
        columns:
          - name: date_date
            description: "Satış işleminin gerçekleştiği tarih."
          - name: orders_id
            description: "Siparişin benzersiz kimlik numarası."
          - name: pdt_id
            description: "Satılan ürünün benzersiz kimlik numarası."
          - name: revenue
            description: "İlgili satıştan elde edilen tutar."
          - name: quantity
            description: "Satılan ürün adedi."

      - name: product
        identifier: raw_gz_product
        description: "Ürünlerin ham katalog ve maliyet verilerini içeren tablo."
        columns:
          - name: products_id
            description: "Ürünün benzersiz kimlik numarası."
          - name: purchse_price
            description: "Ürünün satın alma maliyeti (ham verideki orijinal yazımıyla)."

      - name: ship
        identifier: raw_gz_ship
        description: "Siparişlerin kargo, lojistik ve maliyet bilgilerini içeren ham veri tablosu."
        columns:
          - name: orders_id
            description: "Kargoya verilen siparişin benzersiz kimlik numarası."
          - name: shipping_fee
            description: "Müşteriden tahsil edilen kargo ücreti."
          - name: logcost
            description: "Lojistik operasyonunun iç maliyeti."
          - name: ship_cost
            description: "Gerçekleşen net kargo maliyeti."