version: 2

sources:
  - name: raw
    schema: gwz_raw_data
    description: "Greenweez projesinin ham (raw) verilerini içeren BigQuery veri kümesi (dataset)."
    
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Müşterilerin günlük ve ürün bazlı ham satış verilerini içeren tablo."
        columns:
          - name: date_date
          - name: orders_id
            description: "Siparişin kimlik numarası. (Tek başına benzersiz değildir)."
            tests:
              - not_null
          - name: pdt_id
            description: "Satılan ürünün kimlik numarası."
            tests:
              - not_null
          - name: revenue
          - name: quantity
        
        tests:
          - unique:
              column_name: "(CAST(orders_id AS STRING) || '-' || CAST(pdt_id AS STRING))"

      # product tablosu sales ile aynı hizada yeniden başlıyor
      - name: product
        identifier: raw_gz_product
        description: "Ürünlerin ham katalog ve maliyet verilerini içeren tablo."
        columns:
          - name: products_id
            description: "Ürünün benzersiz kimlik numarası. (Primary Key)"
            tests:
              - unique
              - not_null
          - name: purchse_price
            description: "Ürünün satın alma maliyeti."

      # ship tablosu da aynı hizada
      - name: ship
        identifier: raw_gz_ship
        description: "Siparişlerin kargo, lojistik ve maliyet bilgilerini içeren ham veri tablosu."
        columns:
          - name: orders_id
            description: "Kargoya verilen siparişin benzersiz kimlik numarası. (Primary Key)"
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: "Müşteriden tahsil edilen kargo ücreti."
          - name: logcost
            description: "Lojistik operasyonunun iç maliyeti."
          - name: ship_cost
            description: "Gerçekleşen net kargo maliyeti."